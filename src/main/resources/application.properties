# Application Information
spring.application.name=RAG Chat Application
spring.application.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration
app.upload.dir=./data/uploads
app.index.dir=./data/lucene-index

# Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.chat-model=llama3
ollama.timeout=120

# Chunking Configuration
chunking.size=500
chunking.overlap=100

# Vector Search Configuration
vector.top-k=5
vector.dimension=768

# Logging
logging.level.com.ragchat=INFO
logging.level.org.apache.lucene=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
