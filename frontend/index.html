<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java RAG Chat System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: #001f3f;
            margin-right: 10px;
            border-radius: 2px;
        }

        .upload-area {
            border: 2px dashed #001f3f;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #003d7a;
            background: #e6f2ff;
        }

        .upload-area.dragging {
            border-color: #003d7a;
            background: #cce5ff;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 61, 122, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #001f3f;
        }

        .chat-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            color: white;
            margin-left: 20%;
        }

        .message.assistant {
            background: white;
            border: 1px solid #e0e0e0;
            margin-right: 20%;
        }

        .message-header {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .message-content {
            line-height: 1.6;
        }

        .status {
            background: #f0f0f0;
            padding: 12px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #001f3f;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sources {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .source-chip {
            display: inline-block;
            background: #e9ecef;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin: 5px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Java RAG Chat System</h1>
            <p>Upload PDFs, Ask Questions, Get AI-Powered Answers</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="section">
                <div class="section-title">📄 Upload Document</div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p><strong>Drop PDF here or click to browse</strong></p>
                    <p style="color: #666; font-size: 0.9em; margin-top: 10px;">Maximum file size: 50MB</p>
                    <input type="file" id="fileInput" accept=".pdf">
                </div>
                <div id="uploadStatus"></div>
            </div>

            <!-- Chat Section -->
            <div class="section">
                <div class="section-title">💬 Ask Questions</div>
                <div class="input-group">
                    <input type="text" id="queryInput" placeholder="Ask a question about your documents..." />
                    <button class="btn" onclick="sendQuery()">Send</button>
                </div>
                <div class="chat-container" id="chatContainer">
                    <div style="text-align: center; color: #999; padding: 40px;">
                        Upload a document and start asking questions!
                    </div>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="docsCount">0</div>
                    <div class="stat-label">Documents</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="chunksCount">0</div>
                    <div class="stat-label">Indexed Chunks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="queriesCount">0</div>
                    <div class="stat-label">Queries Made</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let uploadedDocs = 0;
        let queriesCount = 0;

        // Upload Area Interactions
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        });

        // Enter key to send query
        document.getElementById('queryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuery();
        });

        // Upload File Function
        async function uploadFile(file) {
            if (!file.name.endsWith('.pdf')) {
                showStatus('error', 'Please upload a PDF file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            showStatus('info', `Uploading ${file.name}...`);
            showSpinner();

            try {
                const response = await fetch(`${API_BASE_URL}/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'SUCCESS') {
                    showStatus('success', `✓ ${file.name} uploaded successfully! ${data.chunksCreated} chunks created in ${data.processingTimeMs}ms`);
                    uploadedDocs++;
                    updateStats();
                } else {
                    showStatus('error', `✗ Upload failed: ${data.message}`);
                }
            } catch (error) {
                showStatus('error', `✗ Error: ${error.message}`);
            }

            hideSpinner();
        }

        // Send Query Function
        async function sendQuery() {
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a question');
                return;
            }

            // Add user message
            addMessage('user', query);
            document.getElementById('queryInput').value = '';

            // Show loading
            addMessage('assistant', 'Thinking...', true);

            try {
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        topK: 5
                    })
                });

                const data = await response.json();

                // Remove loading message
                removeLastMessage();

                // Add assistant response
                let answer = data.answer || 'No answer generated';
                
                // Add sources
                if (data.retrievedChunks && data.retrievedChunks.length > 0) {
                    const sources = data.retrievedChunks.map(chunk => 
                        `${chunk.documentName} (${chunk.score.toFixed(2)})`
                    ).join(', ');
                    answer += `\n\n📚 Sources: ${sources}`;
                }

                addMessage('assistant', answer);
                queriesCount++;
                updateStats();

            } catch (error) {
                removeLastMessage();
                addMessage('assistant', `Error: ${error.message}`);
            }
        }

        // UI Helper Functions
        function addMessage(type, content, isLoading = false) {
            const chatContainer = document.getElementById('chatContainer');
            
            // Clear placeholder
            if (chatContainer.querySelector('div[style*="text-align: center"]')) {
                chatContainer.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = type === 'user' ? 'You' : '🤖 Assistant';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isLoading) {
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                contentDiv.appendChild(spinner);
            } else {
                contentDiv.textContent = content;
            }
            
            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLastMessage() {
            const chatContainer = document.getElementById('chatContainer');
            const messages = chatContainer.querySelectorAll('.message');
            if (messages.length > 0) {
                messages[messages.length - 1].remove();
            }
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function showSpinner() {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML += '<div class="spinner"></div>';
        }

        function hideSpinner() {
            const spinner = document.querySelector('#uploadStatus .spinner');
            if (spinner) spinner.remove();
        }

        async function updateStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/documents/status`);
                const data = await response.json();
                
                document.getElementById('docsCount').textContent = uploadedDocs;
                document.getElementById('chunksCount').textContent = data.totalIndexedChunks || 0;
                document.getElementById('queriesCount').textContent = queriesCount;
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        // Initialize
        updateStats();
        
        // Test connection on load
        fetch(`${API_BASE_URL}/query/health`)
            .then(response => response.json())
            .then(data => {
                console.log('✓ Connected to backend:', data);
            })
            .catch(error => {
                console.error('✗ Backend connection failed:', error);
                showStatus('error', '⚠️ Cannot connect to backend. Make sure the server is running on port 8080');
            });
    </script>
</body>
</html>
